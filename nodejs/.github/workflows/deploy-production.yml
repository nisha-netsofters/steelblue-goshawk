name: Deploy to Production (Contabo)

on:
  push:
    branches:
      - release/*
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    name: Deploy to Contabo Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          # Try npm ci first, fallback to npm install if lock file is out of sync
          npm ci || (echo "Lock file out of sync, using npm install..." && npm install)

      - name: Run tests (if available)
        run: npm test || echo "No tests configured"
        continue-on-error: true

      - name: Deploy to Contabo Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          # Use the key directly from secrets (action handles parsing)
          # Ensure CONTABO_SSH_KEY contains the full private key including BEGIN/END lines
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_PORT || 22 }}
          script: |
            cd ${{ secrets.CONTABO_APP_PATH_PROD || '/home/uniqueworldnode/uniqueworld-backend-production' }}
            
            # Backup current deployment
            echo "Creating backup..."
            if [ -d "current" ]; then
              cp -r current backup-$(date +%Y%m%d-%H%M%S) || true
            fi
            
            # Pull latest code
            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd
            
            # Install dependencies
            echo "Installing dependencies..."
            npm ci --production

            # Clear any cached modules to ensure clean restart
            echo "Clearing module cache..."
            rm -rf node_modules/.cache || true

            # Run database migrations
            echo "Running database migrations..."
            npm run pro:run-migration || echo "Migration failed or no migrations to run"
            
            # Create logs directory if it doesn't exist
            mkdir -p logs/pm2
            
            # Restart application with PM2
            echo "Restarting application..."
            pm2 reload ecosystem.config.production.js --env production --update-env
            
            # Save PM2 process list
            pm2 save
            
            echo "Deployment completed successfully!"

      - name: Deployment Status
        run: |
          echo "✅ Deployment to production completed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

