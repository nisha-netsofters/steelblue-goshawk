<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f4f6;padding:24px 0;">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 4px 12px rgba(15,23,42,0.08);">
            <tr>
              <td style="background:{{brand.primary}};padding:16px 24px;color:#ffffff;text-align:center;">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="font-size:18px;font-weight:bold;letter-spacing:0.02em;">{{brand.name}}</td>
                    <td align="right"><img src="{{brand.logoUrl}}" alt="{{brand.name}}"
                        style="display:block;margin:0 auto;max-width:150px;height:auto;background:#ffffff;padding:10px 12px;border-radius:8px;" /></td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:24px;color:#111827;font-size:14px;line-height:1.6;">
                <p style="margin:0 0 12px 0;">Dear <strong>{{candidateName}}</strong>,</p>
                <p style="margin:0 0 12px 0;font-weight:600;">Registration Successful</p>
                <p style="margin:0 0 12px 0;">Your registration is successful. Clients from your industry can now view your profile and may contact you for interviews.</p>
                <p style="margin:0 0 12px 0;">Please keep your resume updated for better visibility.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 24px 24px;" align="center">
                <a href="{{brand.portalUrl}}" style="display:inline-block;padding:10px 22px;background:{{brand.accent}};color:#ffffff;text-decoration:none;border-radius:999px;font-size:14px;font-weight:600;" target="_blank">Visit Candidate Portal</a>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 24px 20px 24px;color:#9ca3af;font-size:12px;border-top:1px solid #e5e7eb;">
                <p style="margin:0 0 4px 0;">Regards,</p>
                <p style="margin:0;font-weight:600;color:#6b7280;">{{agencyName}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
